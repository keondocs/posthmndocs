name: Update Changelog

on:
  push:
    branches:
      - main

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog
        run: |
          echo "---" > docs/changelog/changelog.md
          echo "title: CHANGELOG" >> docs/changelog/changelog.md
          echo 'meta: "// site · version history · ongoing"' >> docs/changelog/changelog.md
          echo "tags: [changelog, methodology, version history]" >> docs/changelog/changelog.md
          echo "---" >> docs/changelog/changelog.md
          echo "" >> docs/changelog/changelog.md
          echo "\`\`\`" >> docs/changelog/changelog.md
          echo "POSTHUMAN DOCS — CHANGE LOG" >> docs/changelog/changelog.md
          echo "──────────────────────────────────────────────" >> docs/changelog/changelog.md
          git log --pretty=format:"%ad  %s" --date=format:"%Y-%m-%d %H:%M" >> docs/changelog/changelog.md
          echo "" >> docs/changelog/changelog.md
          echo "\`\`\`" >> docs/changelog/changelog.md

      - name: Commit changelog
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/changelog/changelog.md
          git diff --staged --quiet || git commit -m "update changelog"
          git push